name: Current RFB clipboard capability proof
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  clipboard:
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read the pinned backend source
        id: backend
        run: node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync('contracts/source.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+s.commit+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: YuanYeYouTao/Yuki
          ref: ${{ steps.backend.outputs.commit }}
          path: .cache/backend
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31
          enable-cache: true
          cache-dependency-glob: |
            .cache/backend/uv.lock
            .cache/backend/packages/yuki-agent-connector/uv.lock
      - name: Prepare the actual backend test environment
        run: uv sync --directory .cache/backend --frozen --all-extras --managed-python --python 3.12
      - name: Select the actual backend fixture
        run: node -e "const fs=require('node:fs'),p=require('node:path');const root=p.resolve('.cache/backend');const py=p.join(root,'.venv',process.platform==='win32'?'Scripts/python.exe':'bin/python');fs.appendFileSync(process.env.GITHUB_ENV,'YUKI_BACKEND_TEST_ROOT='+root+'\nYUKI_BACKEND_TEST_PYTHON='+py+'\nYUKI_E2E_OUTPUT='+p.join(process.env.RUNNER_TEMP,'yuki-desktop-e2e')+'\n')"
      - name: Verify actual backend Python SQLite extension support
        run: node -e "require('node:child_process').execFileSync(process.env.YUKI_BACKEND_TEST_PYTHON,['-c','import sqlite3, sys; db = sqlite3.connect(sys.argv[1]); db.enable_load_extension(True); db.enable_load_extension(False); db.close(); print(sys.executable); print(sqlite3.sqlite_version)',':memory:'],{stdio:'inherit'})"
      - run: npm ci
      - name: Bundle the platform's standalone Connector
        run: node build-tools/prepare-connector.mjs --backend .cache/backend
      - name: Bundle the matching local Bot setup
        run: node build-tools/prepare-local-bot.mjs --source .cache/backend
      - name: Build original Computer with the same patched dependency
        run: |-
          cp src/renderer/views/Computer.tsx "$RUNNER_TEMP/Computer-fixed.tsx"
          git show f330da72cc7c303bc4415fbc4d056bcd05a6654a:src/renderer/views/Computer.tsx > src/renderer/views/Computer.tsx
          npm run build
      - name: Prove original UI fails before current ServerCaps
        run: |-
          set +e
          YUKI_E2E_OUTPUT="$RUNNER_TEMP/clipboard-negative" npm exec playwright -- test tests/e2e/computer-preview.spec.ts --reporter=json > "$RUNNER_TEMP/clipboard-negative.json"
          clipboard_negative_exit=$?
          set -e
          if [ "$clipboard_negative_exit" -ne 1 ]; then
            echo "Expected the original UI to fail the current-connection clipboard assertion"
            exit 1
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const report=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'clipboard-negative.json'),'utf8'));
          const tests=suite=>[...(suite.specs??[]).flatMap(spec=>spec.tests??[]),...(suite.suites??[]).flatMap(tests)];
          const results=report.suites.flatMap(tests).flatMap(test=>test.results??[]).filter(result=>result.status==='failed');
          const line=fs.readFileSync('tests/e2e/computer-preview.spec.ts','utf8').split(/\r?\n/).findIndex(line=>line.includes('.isDisabled()'))+1;
          const expected=error=>{
            const message=(error.message??'').replace(/\x1b\[[0-9;]*m/g,'');
            const atAssertion=error.location?.line===line||error.stack?.includes('computer-preview.spec.ts:'+line+':')||error.snippet?.includes('.isDisabled()');
            return atAssertion&&/Expected:\s*true/.test(message)&&/Received:\s*false/.test(message);
          };
          if(report.stats.unexpected!==1||results.length!==1||!results[0].errors.some(expected))throw Error('Baseline did not prove enabled paste at the current connected-but-CAPS-held assertion');
          console.log('Original Computer.tsx failed exactly at the current-RFB paste-disabled assertion; no corrupted paste was sent');
          JS
      - name: Restore reviewed UI
        if: always()
        run: cp "$RUNNER_TEMP/Computer-fixed.tsx" src/renderer/views/Computer.tsx
      - name: Exercise fixed real RFB and original Work completion
        if: always()
        env:
          YUKI_E2E_OUTPUT: ${{ runner.temp }}/clipboard-positive
        run: |-
          npm run build
          npm exec playwright -- test tests/e2e/computer-preview.spec.ts tests/e2e/work-inputs.spec.ts --grep 'real preview stays|inline answers and supplements' --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-current-rfb-proof
          path: |-
            ${{ runner.temp }}/clipboard-negative.json
            ${{ runner.temp }}/clipboard-negative
            ${{ runner.temp }}/clipboard-positive
          if-no-files-found: warn
