name: Desktop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec install-electron -- --no
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contract
      - run: npm test
      - run: npm exec playwright install chromium
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - run: npm run package
      - run: npm run check:package
      - uses: actions/upload-artifact@v4
        with:
          name: Yuki-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
