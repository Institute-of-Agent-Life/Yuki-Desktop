name: Desktop ARM original Work probe
run-name: ARM original Work facts · ${{ github.ref_name }} · attempt ${{ github.run_attempt }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-arm-work-probe-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  original-work:
    name: Original Work facts (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read the pinned backend source
        id: backend
        run: node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync('contracts/source.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+s.commit+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: YuanYeYouTao/Yuki
          ref: ${{ steps.backend.outputs.commit }}
          path: .cache/backend
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: |
            .cache/backend/uv.lock
            .cache/backend/packages/yuki-agent-connector/uv.lock
      - name: Prepare the actual backend test environment
        run: uv sync --directory .cache/backend --frozen --all-extras --python 3.12
      - name: Select and record the actual backend fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const cp = require('node:child_process')
          const root = path.resolve('.cache/backend')
          const py = path.join(root, '.venv/bin/python')
          const output = path.join(process.env.RUNNER_TEMP, 'yuki-desktop-arm-work-probe')
          fs.appendFileSync(process.env.GITHUB_ENV,
            'YUKI_BACKEND_TEST_ROOT=' + root + '\n' +
            'YUKI_BACKEND_TEST_PYTHON=' + py + '\n' +
            'YUKI_E2E_OUTPUT=' + output + '\n')
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'arm-work-source.json'),
            JSON.stringify({
              purpose: 'Isolated diagnostic run; not a release or final acceptance',
              desktopCommit: process.env.GITHUB_SHA,
              backendCommit: cp.execFileSync('git', ['-C', root, 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
              contractSource: JSON.parse(fs.readFileSync('contracts/source.json', 'utf8')),
              node: process.version,
              platform: process.platform,
              arch: process.arch,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              test: 'tests/e2e/work.spec.ts'
            }, null, 2))
          NODE
      - run: npm ci
      - name: Bundle the platform's standalone Connector
        run: node build-tools/prepare-connector.mjs --backend .cache/backend
      - name: Bundle the matching local Bot setup
        run: node build-tools/prepare-local-bot.mjs --source .cache/backend
      - run: npm exec playwright install -- --with-deps chromium
      - name: Install the formal Linux desktop dependencies
        run: sudo apt-get install --no-install-recommends -y rpm ffmpeg libnotify4 dbus-x11 gnome-keyring openbox
      - name: Configure Electron sandbox for Ubuntu CI
        run: |
          node -e 'require("electron")'
          electron_path="$(node --print 'require("electron")')"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile yuki-desktop-ci "%s" flags=(unconfined) {\n  userns,\n}\n' "$electron_path" | sudo tee /etc/apparmor.d/yuki-desktop-ci
          sudo apparmor_parser --replace /etc/apparmor.d/yuki-desktop-ci
      - name: Build the actual Desktop
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/arm-work-build.log"
      - name: Run only the original Work scenario with complete trace
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" bash -e -c '
            export XDG_DATA_HOME="$RUNNER_TEMP/yuki-keyring-data"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/yuki-keyring-config"
            printf "%s" "yuki-ci-test" | gnome-keyring-daemon --unlock --components=secrets > "$RUNNER_TEMP/keyring-startup.log"
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            node build-tools/check-linux-keyring.mjs
            node build-tools/diagnose-linux-notifications.mjs
            npm exec playwright test -- tests/e2e/work.spec.ts --trace on
          ' 2>&1 | tee "$RUNNER_TEMP/arm-work-e2e.log"
      - name: Record this diagnostic run's outcome
        if: always()
        env:
          PROBE_JOB_STATUS: ${{ job.status }}
          PROBE_BACKEND_COMMIT: ${{ steps.backend.outputs.commit }}
        run: |
          printf '%s\n' "desktop_commit=$GITHUB_SHA" "backend_commit=$PROBE_BACKEND_COMMIT" \
            "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "status=$PROBE_JOB_STATUS" > "$RUNNER_TEMP/arm-work-run.txt"
      - name: Retain this run's original Work evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yuki-arm-original-work-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yuki-desktop-arm-work-probe
            ${{ runner.temp }}/arm-work-run.txt
            ${{ runner.temp }}/arm-work-source.json
            ${{ runner.temp }}/arm-work-build.log
            ${{ runner.temp }}/arm-work-e2e.log
            ${{ runner.temp }}/keyring-startup.log
            ${{ runner.temp }}/openbox.log
          if-no-files-found: warn
