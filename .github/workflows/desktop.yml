name: PDF native viewer Mac verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read the pinned backend source
        id: backend
        run: node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync('contracts/source.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+s.commit+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: YuanYeYouTao/Yuki
          ref: ${{ steps.backend.outputs.commit }}
          path: .cache/backend
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: |
            .cache/backend/uv.lock
            .cache/backend/packages/yuki-agent-connector/uv.lock
      - name: Prepare the actual backend test environment
        run: uv sync --directory .cache/backend --frozen --all-extras --managed-python --python 3.12
      - name: Select the actual backend fixture
        run: node -e "const fs=require('node:fs'),p=require('node:path');const root=p.resolve('.cache/backend');const py=p.join(root,'.venv','bin/python');fs.appendFileSync(process.env.GITHUB_ENV,'YUKI_BACKEND_TEST_ROOT='+root+'\nYUKI_BACKEND_TEST_PYTHON='+py+'\nYUKI_E2E_OUTPUT='+p.join(process.env.RUNNER_TEMP,'yuki-pdf-native-verification')+'\n')"
      - run: npm ci
      - run: node build-tools/prepare-connector.mjs --backend .cache/backend
      - run: node build-tools/prepare-local-bot.mjs --source .cache/backend
      - run: npm run lint
      - run: npm run typecheck
      - run: node build-tools/check-backend-contract.mjs
      - run: npm run build
      - name: Exercise actual PDF attachments and delivered artifacts
        run: npm exec playwright -- test tests/e2e/artifacts.spec.ts tests/e2e/character-data.spec.ts tests/e2e/server-settings.spec.ts tests/e2e/rich-media.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDF-native-viewer-${{ matrix.os }}
          path: ${{ runner.temp }}/yuki-pdf-native-verification
          if-no-files-found: warn
